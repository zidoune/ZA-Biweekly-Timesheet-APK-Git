
name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install native shared Documents export plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/za/timesheet
          cat > android/app/src/main/java/za/timesheet/PublicFilePlugin.java <<'JAVA'
          package za.timesheet;
          
          import android.content.ContentValues;
          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          
          @CapacitorPlugin(name = "PublicFilePlugin")
          public class PublicFilePlugin extends Plugin {
              @PluginMethod
              public void saveFile(PluginCall call) {
                  String fileName = call.getString("fileName");
                  String data = call.getString("data");
                  String mimeType = call.getString("mimeType", "application/octet-stream");
                  if (fileName == null || fileName.trim().isEmpty() || data == null || data.isEmpty()) {
                      call.reject("A filename and file data are required.");
                      return;
                  }
          
                  byte[] bytes;
                  try {
                      bytes = Base64.decode(data, Base64.DEFAULT);
                  } catch (IllegalArgumentException error) {
                      call.reject("The file data was not valid Base64.", error);
                      return;
                  }
          
                  try {
                      Uri uri;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH,
                              Environment.DIRECTORY_DOCUMENTS + "/Timesheet");
                          values.put(MediaStore.MediaColumns.IS_PENDING, 1);
          
                          Uri collection = MediaStore.Files.getContentUri("external");
                          uri = getContext().getContentResolver().insert(collection, values);
                          if (uri == null) {
                              throw new IllegalStateException("Android could not create Documents/Timesheet.");
                          }
          
                          try (OutputStream output = getContext().getContentResolver().openOutputStream(uri, "w")) {
                              if (output == null) throw new IllegalStateException("Could not open the new file.");
                              output.write(bytes);
                              output.flush();
                          } catch (Exception writeError) {
                              getContext().getContentResolver().delete(uri, null, null);
                              throw writeError;
                          }
          
                          ContentValues ready = new ContentValues();
                          ready.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          getContext().getContentResolver().update(uri, ready, null, null);
                      } else {
                          File documents = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS);
                          File folder = new File(documents, "Timesheet");
                          if (!folder.exists() && !folder.mkdirs()) {
                              throw new IllegalStateException("Could not create Documents/Timesheet.");
                          }
                          File outputFile = new File(folder, fileName);
                          try (FileOutputStream output = new FileOutputStream(outputFile)) {
                              output.write(bytes);
                              output.flush();
                          }
                          uri = Uri.fromFile(outputFile);
                      }
          
                      JSObject result = new JSObject();
                      result.put("uri", uri.toString());
                      result.put("path", "Documents/Timesheet/" + fileName);
                      call.resolve(result);
                  } catch (Exception error) {
                      call.reject("Could not save to Documents/Timesheet: " + error.getMessage(), error);
                  }
              }

              @PluginMethod
              public void shareFile(PluginCall call) {
                  String uriString = call.getString("uri");
                  String mimeType = call.getString("mimeType", "application/pdf");
                  String title = call.getString("title", "Timesheet PDF");
                  if (uriString == null || uriString.trim().isEmpty()) {
                      call.reject("A saved PDF URI is required.");
                      return;
                  }

                  try {
                      Uri fileUri = Uri.parse(uriString);
                      Intent sendIntent = new Intent(Intent.ACTION_SEND);
                      sendIntent.setType(mimeType);
                      sendIntent.putExtra(Intent.EXTRA_STREAM, fileUri);
                      sendIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      sendIntent.setClipData(ClipData.newUri(
                          getContext().getContentResolver(), title, fileUri));
                      Intent chooser = Intent.createChooser(sendIntent, "Open or share timesheet PDF");
                      chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      getActivity().startActivity(chooser);
                      call.resolve();
                  } catch (Exception error) {
                      call.reject("Could not open Android's PDF share menu: " + error.getMessage(), error);
                  }
              }
          }
          JAVA
          cat > android/app/src/main/java/za/timesheet/MainActivity.java <<'JAVA'
          package za.timesheet;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PublicFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Add legacy storage permissions for older Android versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              ("android.permission.READ_EXTERNAL_STORAGE", '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'),
              ("android.permission.WRITE_EXTERNAL_STORAGE", '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />'),
          ]
          missing = [line for name, line in permissions if f'android:name="{name}"' not in content]
          if missing:
              match = re.search(r'<manifest\b[^>]*>', content)
              if not match:
                  raise SystemExit("Could not find the Android manifest root element.")
              content = content[:match.end()] + "\n" + "\n".join(missing) + content[match.end():]
              manifest.write_text(content)
          print("Legacy storage permissions configured; modern Android uses scoped storage.")
          PY

      - name: Build debug and release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease


      - name: Check signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing keystore secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing keystore password"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing key alias"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing key password"; exit 1; }
          echo "All four signing secrets are present."

      - name: Sign release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="$RUNNER_TEMP/za-timesheet-release.jks"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/app-release-aligned.apk"
          OUTPUT="android/app/build/outputs/apk/release/ZA-Biweekly-Timesheet-release.apk"

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          test -f "$UNSIGNED"

          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$OUTPUT" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT"

          rm -f "$KEYSTORE" "$ALIGNED"

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: za-timesheet-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/ZA-Biweekly-Timesheet-release.apk
          if-no-files-found: error
